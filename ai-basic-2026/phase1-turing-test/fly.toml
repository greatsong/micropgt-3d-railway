# Fly.io 예비 배포 (Railway 도메인이 차단된 네트워크용). 주소: https://ai-turing-danggok.fly.dev/turing-test/
app = 'ai-turing-danggok'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_BASE_PATH = '/turing-test'
  PORT = '4024'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4024
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'ai_turing_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
