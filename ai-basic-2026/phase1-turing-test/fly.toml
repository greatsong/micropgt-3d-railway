app = 'turing-test-codex'
primary_region = 'nrt'

[build]

[env]
  APP_BASE_PATH = '/turing-test-codex'
  PORT = '4024'

[http_service]
  internal_port = 4024
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'turing_test_codex_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
